{% extends "base.html" %} {% load static %} {%block 'head'%}
<link rel="stylesheet" href="{% static 'css/table.css'%}" />
<link rel="stylesheet" href="{% static 'css/class_students.css' %}">
<link rel="stylesheet" href="{% static 'css/modals.css' %}">
{%endblock%} {% block 'main' %}
<main class="borrow-history ">
  <div class="back-arrow">
    <a href="{%if request.user.profile.profile_type == 1%}{% url 'borrow_management' %}{% else %}{% url 'index' %}{% endif %}"
      ><img src="{% static 'assets/icons/back-arrow.svg' %}" alt=""
    /></a>
  </div>
  <div>
    <h1>Salas</h1>
    <div class="actions-area">
      <button id="open-modal-button">
        Adicionar sala<img src="{% static "assets/icons/add_icon.svg" %}">
      </button>
    </div>
    <div class="teacher_class_list">
        {% for s_class in school_classes %}
        <div class="class-name-container">
          <a href="{% url 'school_class_management' s_class.id %}">{{s_class.school_class_name}}</a>
        {% endfor %}
      </div>
    </div>
  </div>

  <dialog id="addClassModal">
    <p>Adicionar Turma</p>
    <form method="post" enctype="multipart/form-data">
        {%csrf_token%}
        <div class="form_content">
            <div class="form_camps">
                <label for="{{ form.school_class_name.id_for_label }}">Nome da turma</label>
                {{ form.school_class_name }}
            </div>
            
            <label class="file-input" for="{{ form.school_class_students_wid.id_for_label }}"></label>        
            {{ form.school_class_students_wid }}
            
        </div>
        <br>
        <div class="buttons-area">
            <button id="neutral-button" type="button">Cancelar</button>
            <button type="submit">Enviar</button>
        </div>
    </form>
  </dialog>

</main>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const modal = document.getElementById("addClassModal");
    const openModalButton = document.getElementById("open-modal-button");
    const closeModalButton = document.getElementById("neutral-button");

    openModalButton.addEventListener("click", function () {
      console.log('Entrou')
      modal.showModal();  
    });
  
    
    closeModalButton.addEventListener("click", function () {
      modal.close();  
    });
    
  });
</script>
{% endblock %}
