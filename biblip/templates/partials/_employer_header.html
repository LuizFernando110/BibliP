{%load static%}
<header class="employer-header">
  <div class="ifrn-logo-section">
    <div class="ifrn-logo">
      <a href="{% url "borrow_management" %}"><img src="{% static 'assets/IFRN-Logo-white.png' %}" alt="" /></a>
    </div>
  </div>

  <form action="" method="get" class="search-input-container">
    <input type="text" placeholder="Pesquisar por nome, código, autor ... "  name="search" value="{{ request.GET.search }}"/>
    {% for key, value in request.GET.items %}
      {% if key != "search" %}
          <input type="hidden" name="{{ key }}" value="{{ value }}">
      {% endif %}
  {% endfor %}
    <button class="search-button">
      <img src="{% static 'assets/icons/search.svg' %}" alt="" />
    </button>
  </form>

  <div class="header-btn-section">
    <a href="{% url "books_management" %}" class="header-btn">
      Livros
    </a>
    <a href="{% url 'employer_borrow_list'%}" class="header-btn">
      Alugueis
    </a>
    {%include 'partials/_profile_icon.html'%}
  </div>
</header>
